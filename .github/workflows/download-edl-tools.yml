name: Download EDL Tools

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # 每周日检查更新

jobs:
  download-tools:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Create Tools Directory
      run: mkdir -p edl-tools

    - name: Download QPST
      run: |
        # QPST 官方下载链接（可能需要更新）
        QPST_URL="https://qpsttool.com/download/qpst-tool-v2-7-496/"
        
        echo "Downloading QPST..."
        # 使用 wget 尝试下载（实际链接可能需要调整）
        wget --timeout=30 --tries=3 -O edl-tools/QPST_Download_Link.txt "$QPST_URL" || {
          echo "QPST download link saved to QPST_Download_Link.txt"
          echo "Please visit: $QPST_URL" > edl-tools/QPST_Download_Link.txt
        }

    - name: Download Firehose Files
      run: |
        echo "Downloading Firehose files for Snapdragon 685 (SM6225)..."
        
        # 创建 firehose 目录
        mkdir -p edl-tools/firehose-sm6225
        
        # Firehose 文件通常需要从官方固件提取
        # 这里创建说明文件
        cat > edl-tools/firehose-sm6225/README.md << 'EOF'
        # Firehose Files for Snapdragon 685 (SM6225)
        
        ## 文件名格式
        - prog_emmc_firehose_$(chip_id)_$(storage).mbn
        - prog_ufs_firehose_$(chip_id)_$(storage).mbn
        
        ## Redmi Note 13 Pro 所需文件
        - prog_emmc_firehose_sm6225.mbn (eMMC 版本)
        - prog_ufs_firehose_sm6225.mbn (UFS 版本)
        
        ## 获取途径
        
        ### 1. 官方固件提取
        ```bash
        # 下载官方 ROM (tgz 格式)
        # 解压后找到 firehose 文件
        tar -xzf miui_GARNET_*.tgz
        find . -name "prog_*_firehose_*.mbn"
        ```
        
        ### 2. XDA 论坛
        - https://forum.xda-developers.com/f/xiaomi-redmi-note-13-pro.12793/
        
        ### 3. 付费资源
        - 淘宝搜索 "SM6225 firehose"
        - Telegram 群组
        
        ## 使用说明
        1. 将 firehose 文件放入 QPST/QFIL 目录
        2. QFIL 中选择对应的 Programmer 文件
        3. 开始刷机
        
        ## 注意事项
        - 务必使用对应机型的 firehose 文件
        - 错误的文件可能导致设备变砖
        EOF

    - name: Download USB Drivers
      run: |
        echo "Downloading Qualcomm USB Drivers..."
        
        cat > edl-tools/Driver_Download_Links.md << 'EOF'
        # USB 驱动下载链接
        
        ## 1. Qualcomm HS-USB QDLoader 9008 Driver
        - 官方: https://developer.qualcomm.com/
        - 第三方: https://adbdriver.com/download-qualcomm-driver.htm
        
        ## 2. Google USB Driver (ADB)
        - https://developer.android.com/studio/run/win-usb
        
        ## 3. 小米 USB 驱动
        - http://www.miui.com/download.html
        
        ## 安装步骤
        1. 下载驱动安装包
        2. 右键 "此电脑" → 管理 → 设备管理器
        3. 找到带黄色感叹号的 "QDLoader 9008"
        4. 右键更新驱动 → 浏览计算机 → 选择驱动目录
        5. 安装完成后端口应显示正常
        EOF

    - name: Create Installation Guide
      run: |
        cat > edl-tools/INSTALL_GUIDE.md << 'EOF'
        # EDL 刷机工具完整包
        
        ## 包含内容
        - QPST/QFIL 刷机软件下载链接
        - Firehose 文件获取指南
        - USB 驱动下载链接
        - 完整使用教程
        
        ## 快速开始
        
        ### Windows 用户
        1. 安装 QPST (见 QPST_Download_Link.txt)
        2. 安装 USB 驱动 (见 Driver_Download_Links.md)
        3. 获取 Firehose 文件 (见 firehose-sm6225/README.md)
        4. 运行刷机脚本或手动 QFIL 刷机
        
        ### 注意事项
        - ⚠️ 刷机有风险，操作需谨慎
        - ⚠️ 务必先备份原厂 boot
        - ⚠️ 确保电池电量充足
        
        ## 相关资源
        - 刷机脚本: ../full-flash.sh
        - EDL 教程: ../EDL-GUIDE.md
        - KernelSU: https://kernelsu.org/
        EOF

    - name: Package Tools
      run: |
        zip -r edl-tools-redmi-note13pro.zip edl-tools/

    - name: Upload to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: edl-tools-redmi-note13pro
        path: edl-tools/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'workflow_dispatch'
      with:
        tag_name: edl-tools-$(date +%Y%m%d)
        name: EDL Tools for Redmi Note 13 Pro ($(date +%Y-%m-%d))
        body: |
          ## EDL (9008) 刷机工具包
          
          ### 包含内容
          - QPST/QFIL 下载链接
          - Firehose 文件获取指南
          - USB 驱动下载链接
          - 完整安装教程
          
          ### 适用机型
          - Redmi Note 13 Pro (garnet)
          - 骁龙 685 (SM6225)
          
          ### 使用方法
          1. 下载并解压工具包
          2. 按照 INSTALL_GUIDE.md 安装软件
          3. 参考 EDL-GUIDE.md 进行刷机
          
          ⚠️ **风险提示**: 刷机有风险，请谨慎操作！
        files: |
          edl-tools-redmi-note13pro.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
