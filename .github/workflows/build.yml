name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Debug - Check project structure
        run: |
          echo "=== 查看 res/layout/ 目录内容 ==="
          ls -la app/src/main/res/layout/ || true
          echo ""
          echo "=== 查找所有 fragment 布局文件 ==="
          find . -name "fragment_*.xml" 2>/dev/null || true
          echo ""
          echo "=== 查看 res/menu/ 目录内容 ==="
          ls -la app/src/main/res/menu/ || true

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/debug
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload Signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-signed-release
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          retention-days: 30
