name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate icons
        run: |
          sudo apt-get install -y imagemagick
          convert ci-assets/icon.png -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert ci-assets/icon.png -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert ci-assets/icon.png -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert ci-assets/icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert ci-assets/icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
