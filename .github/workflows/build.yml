name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate icons
        run: |
          sudo apt-get install -y imagemagick

          for mipmap_dir in $(find . -type d -name "mipmap-*"); do
            mkdir -p "$mipmap_dir"
            if [[ "$mipmap_dir" == *"mdpi" ]]; then
              convert ci-assets/icon.png -resize 48x48 "$mipmap_dir/ic_launcher.png"
              convert ci-assets/icon.png -resize 48x48 "$mipmap_dir/ic_launcher_round.png"
            elif [[ "$mipmap_dir" == *"hdpi" ]]; then
              convert ci-assets/icon.png -resize 72x72 "$mipmap_dir/ic_launcher.png"
              convert ci-assets/icon.png -resize 72x72 "$mipmap_dir/ic_launcher_round.png"
            elif [[ "$mipmap_dir" == *"xhdpi" ]]; then
              convert ci-assets/icon.png -resize 96x96 "$mipmap_dir/ic_launcher.png"
              convert ci-assets/icon.png -resize 96x96 "$mipmap_dir/ic_launcher_round.png"
            elif [[ "$mipmap_dir" == *"xxhdpi" ]]; then
              convert ci-assets/icon.png -resize 144x144 "$mipmap_dir/ic_launcher.png"
              convert ci-assets/icon.png -resize 144x144 "$mipmap_dir/ic_launcher_round.png"
            elif [[ "$mipmap_dir" == *"xxxhdpi" ]]; then
              convert ci-assets/icon.png -resize 192x192 "$mipmap_dir/ic_launcher.png"
              convert ci-assets/icon.png -resize 192x192 "$mipmap_dir/ic_launcher_round.png"
            fi
          done

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
