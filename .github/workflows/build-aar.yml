name: Build LiteRT-LM AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: google-ai-edge/litert-lm
        ref: main

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-33 build-tools;33.0.0'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build AAR
      run: ./gradlew :litertlm-android:assembleRelease

    - name: Upload AAR
      uses: actions/upload-artifact@v4
      with:
        name: litertlm-android-aar
        path: litertlm-android/build/outputs/aar/litertlm-android-release.aar
