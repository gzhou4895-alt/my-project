name: Build KernelSU for Redmi Note 13 Pro

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version tag (e.g., v1.0.2)'
        required: true
        default: 'v1.0.2'
  push:
    paths:
      - 'kernelsu-note13pro/**'
  schedule:
    - cron: '0 2 * * 0'  # 每周日凌晨2点检查更新

env:
  KERNELSU_VERSION: ${{ github.event.inputs.kernel_version || 'v1.0.2' }}
  DEVICE_CODENAME: garnet
  DEVICE_NAME: "Redmi Note 13 Pro"

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache \
          flex git gnupg gperf liblz4-tool \
          libncurses5-dev libsdl1.2-dev libssl-dev \
          libxml2 libxml2-utils lzop \
          pngcrush rsync schedtool squashfs-tools \
          xsltproc zip zlib1g-dev \
          python3 python3-pip curl wget

    - name: Setup Android Build Environment
      run: |
        # Download Android NDK
        mkdir -p ~/android-ndk
        cd ~/android-ndk
        wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
        unzip -q android-ndk-r26b-linux.zip
        echo "ANDROID_NDK=$PWD/android-ndk-r26b" >> $GITHUB_ENV
        echo "$PWD/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

    - name: Download Kernel Source
      run: |
        mkdir -p ~/kernel-workspace
        cd ~/kernel-workspace
        
        # 下载小米开源内核（如果有）
        # 或者使用通用 GKI 内核
        echo "Downloading kernel source..."
        
        # 尝试下载小米官方内核
        git clone --depth 1 https://github.com/MiCode/Kernel_OpenAndroid.git kernel-mi || {
          echo "MiCode kernel not available, using alternative..."
          # 使用 Android Common Kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15
          repo sync -c -j8
        }

    - name: Download KernelSU
      run: |
        cd ~/kernel-workspace
        
        echo "Downloading KernelSU ${{ env.KERNELSU_VERSION }}..."
        git clone --depth 1 --branch ${{ env.KERNELSU_VERSION }} \
          https://github.com/tiann/KernelSU.git KernelSU
        
        # 复制 KernelSU 驱动到内核目录
        cp -r KernelSU/kernel ~/kernel-workspace/KernelSU-driver

    - name: Configure Kernel
      run: |
        cd ~/kernel-workspace/kernel-mi 2>/dev/null || cd ~/kernel-workspace/common
        
        # 设置编译环境
        export PATH=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-android-
        
        # 加载默认配置
        make O=out ARCH=arm64 gki_defconfig
        
        # 启用 KernelSU
        echo "CONFIG_KSU=y" >> out/.config
        
        # 保存配置
        make O=out ARCH=arm64 savedefconfig
        cp out/defconfig arch/arm64/configs/gki_defconfig

    - name: Build Kernel
      run: |
        cd ~/kernel-workspace/kernel-mi 2>/dev/null || cd ~/kernel-workspace/common
        
        export PATH=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        
        echo "Building kernel..."
        make O=out ARCH=arm64 \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-android- \
          -j$(nproc)
        
        # 检查输出
        ls -la out/arch/arm64/boot/

    - name: Create Flashable Image
      run: |
        mkdir -p ~/output
        cd ~/kernel-workspace/kernel-mi 2>/dev/null || cd ~/kernel-workspace/common
        
        # 复制编译好的内核
        if [ -f out/arch/arm64/boot/Image.gz ]; then
          cp out/arch/arm64/boot/Image.gz ~/output/
        fi
        
        if [ -f out/arch/arm64/boot/Image ]; then
          cp out/arch/arm64/boot/Image ~/output/
        fi
        
        # 创建 boot.img（需要原始 boot.img 作为基础）
        echo "Note: To create flashable boot.img, original boot.img is needed"
        echo "Users should use the full-flash.sh script with their stock boot.img"

    - name: Package Build
      run: |
        cd ~/output
        
        # 创建信息文件
        cat > BUILD_INFO.txt << EOF
        KernelSU Build for ${{ env.DEVICE_NAME }}
        ======================================
        Device: ${{ env.DEVICE_NAME }} (${{ env.DEVICE_CODENAME }})
        KernelSU Version: ${{ env.KERNELSU_VERSION }}
        Build Date: $(date)
        Build ID: ${{ github.run_id }}
        
        This is a GKI (Generic Kernel Image) build.
        
        Usage:
        1. Extract your stock boot.img from device or firmware
        2. Use KernelSU app to patch boot.img, OR
        3. Use provided flash script
        
        Warning: Flash at your own risk!
        EOF
        
        zip -r kernelsu-${{ env.DEVICE_CODENAME }}-${{ env.KERNELSU_VERSION }}.zip *

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernelsu-${{ env.DEVICE_CODENAME }}-${{ env.KERNELSU_VERSION }}
        path: ~/output/*.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'workflow_dispatch'
      with:
        tag_name: kernelsu-${{ env.DEVICE_CODENAME }}-${{ env.KERNELSU_VERSION }}
        name: KernelSU ${{ env.KERNELSU_VERSION }} for ${{ env.DEVICE_NAME }}
        body: |
          ## KernelSU ${{ env.KERNELSU_VERSION }} for ${{ env.DEVICE_NAME }}
          
          ### 设备信息
          - **机型**: ${{ env.DEVICE_NAME }}
          - **代号**: ${{ env.DEVICE_CODENAME }}
          - **芯片**: 骁龙 685 (SM6225)
          
          ### 编译信息
          - **KernelSU 版本**: ${{ env.KERNELSU_VERSION }}
          - **编译日期**: ${{ github.event.head_commit.timestamp }}
          - **提交**: ${{ github.sha }}
          
          ### 使用方法
          1. 下载 `kernelsu-*.zip`
          2. 解压获取内核文件
          3. 使用 `full-flash.sh` 或 `edl-flash.sh` 刷入
          4. 参考 [EDL-GUIDE.md](../blob/main/kernelsu-note13pro/EDL-GUIDE.md) 获取详细教程
          
          ### 注意事项
          - ⚠️ 需要拆机进入 9008 模式（未解锁 BL）
          - ⚠️ 刷机前务必备份原厂 boot
          - ⚠️ 操作风险自负
          
          ### 相关链接
          - [刷机脚本](https://github.com/${{ github.repository }}/tree/main/kernelsu-note13pro)
          - [KernelSU 官方](https://kernelsu.org/)
          - [XDA 板块](https://forum.xda-developers.com/f/xiaomi-redmi-note-13-pro.12793/)
        files: ~/output/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Summary
      run: |
        echo "========================================"
        echo "Build Summary"
        echo "========================================"
        echo "Device: ${{ env.DEVICE_NAME }}"
        echo "Codename: ${{ env.DEVICE_CODENAME }}"
        echo "KernelSU Version: ${{ env.KERNELSU_VERSION }}"
        echo "Status: ${{ job.status }}"
        echo "========================================"
